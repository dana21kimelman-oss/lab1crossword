<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossword Generator</title>
  <meta name="description" content="A crossword generator built with vanilla HTML, CSS and JavaScript." />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Crossword Generator</h1>
    <p class="tagline">A 15&times;15 crossword grid.</p>
  </header>

  <main>
    <div id="grid" class="grid" role="grid" aria-label="Crossword grid"></div>
    <p class="hint">
      Click a square and type. Arrow keys move, <kbd>Space</kbd> or clicking
      the selected square switches between across and down.
    </p>
  </main>

  <footer class="site-footer">
    <p>Built with plain web technologies.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
